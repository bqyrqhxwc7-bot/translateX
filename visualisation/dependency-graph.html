<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translex · 全链路依赖图</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1E1E1E;
    --panel-border: #333;
    --text: rgba(255,255,255,0.92);
    --text-dim: rgba(255,255,255,0.55);
    --accent: #4FC1FF;
    --accent2: #6CCB5F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
  }
  /* ---------- 顶栏 ---------- */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 50;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: rgba(30,30,30,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--panel-border);
  }
  #toolbar .logo { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #toolbar .logo small { color: var(--text-dim); font-weight: 400; margin-left: 8px; }
  #toolbar .search { flex: 1; max-width: 420px; position: relative; }
  #toolbar .search input {
    width: 100%; padding: 7px 12px 7px 32px; border-radius: 6px;
    border: 1px solid var(--panel-border); background: #2A2A2A; color: var(--text);
    outline: none; font-size: 13px;
  }
  #toolbar .search input:focus { border-color: var(--accent); }
  #toolbar .search .icon { position: absolute; left: 10px; top: 7px; color: var(--text-dim); }
  #toolbar .btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--panel-border);
    background: #2A2A2A; color: var(--text); cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  #toolbar .btn:hover { border-color: var(--accent); color: var(--accent); }
  #toolbar .seg { display: flex; border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; }
  #toolbar .seg button {
    padding: 7px 12px; border: none; background: #2A2A2A; color: var(--text-dim);
    cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  #toolbar .seg button + button { border-left: 1px solid var(--panel-border); }
  #toolbar .seg button.active { background: rgba(79,193,255,0.15); color: var(--accent); }
  #toolbar .stats { margin-left: auto; color: var(--text-dim); font-size: 12px; white-space: nowrap; }

  /* ---------- 侧边过滤器 ---------- */
  #panel {
    position: fixed; top: 60px; right: 12px; width: 236px; z-index: 40;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 12px 14px; max-height: calc(100vh - 80px); overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #panel h3 { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 6px; }
  #panel h3:first-child { margin-top: 0; }
  #panel .f-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
  #panel .f-item input { accent-color: var(--accent); cursor: pointer; }
  #panel .f-item .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #panel .f-item .lbl { flex: 1; }
  #panel .f-item .cnt { color: var(--text-dim); font-size: 11px; }
  #panel .legend-line { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  #panel .legend-line svg { flex: none; }

  /* ---------- 详情面板 ---------- */
  #detail {
    position: fixed; left: 12px; top: 60px; width: 300px; z-index: 40;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: none; max-height: calc(100vh - 80px); overflow-y: auto;
  }
  #detail .d-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #detail .d-title .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; color: #fff; font-weight: 500; }
  #detail .d-kv { margin-top: 10px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 8px; font-size: 12px; }
  #detail .d-kv .k { color: var(--text-dim); }
  #detail .d-desc { margin-top: 10px; font-size: 12px; line-height: 1.6; color: var(--text); }
  #detail .d-links { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  #detail .d-links a { color: var(--accent); font-size: 12px; text-decoration: none; }
  #detail .d-links a:hover { text-decoration: underline; }
  #detail .d-close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--text-dim); font-size: 16px; }
  #detail .d-close:hover { color: var(--text); }
  #detail .d-deps { margin-top: 12px; font-size: 12px; }
  #detail .d-deps .t { color: var(--text-dim); margin-bottom: 4px; }
  #detail .d-deps .chip {
    display: inline-block; padding: 2px 8px; margin: 2px; border-radius: 10px; font-size: 11px;
    border: 1px solid var(--panel-border); cursor: pointer; background: #262626;
  }
  #detail .d-deps .chip:hover { border-color: var(--accent); }

  /* ---------- SVG 图区 ---------- */
  #graph { position: fixed; inset: 52px 0 0 0; width: 100%; height: calc(100vh - 52px); cursor: grab; }
  #graph.dragging { cursor: grabbing; }
  #graph .layer-band { pointer-events: none; }
  #graph .layer-band text { font-size: 11px; fill: rgba(255,255,255,0.14); letter-spacing: 2px; }
  #graph .edge { stroke-linecap: round; transition: opacity .15s; }
  #graph .node-g { cursor: pointer; }
  #graph .node-g .node-ring { transition: r .15s, stroke .15s; }
  #graph .node-g:hover .node-ring { stroke: #fff; }
  #graph .node-g .node-label { font-size: 11px; fill: rgba(255,255,255,0.85); pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,0.7); stroke-width: 3px; }
  #graph .node-g.dim { opacity: .18; }

  /* ---------- 依赖扩散动画控制条 ---------- */
  #anim-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
    background: rgba(30,30,30,0.95); border-top: 1px solid var(--panel-border);
    display: none; align-items: center; gap: 10px; padding: 8px 14px;
    backdrop-filter: blur(8px);
  }
  #anim-bar.visible { display: flex; }
  #anim-bar .ab-btn {
    width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--panel-border);
    background: #2A2A2A; color: var(--text); cursor: pointer; font-size: 14px; flex: none;
  }
  #anim-bar .ab-btn:hover { border-color: var(--accent); color: var(--accent); }
  #anim-bar .ab-btn.play { width: 46px; background: rgba(79,193,255,0.18); border-color: var(--accent); color: var(--accent); }
  #anim-bar .ab-progress { flex: 1; display: flex; align-items: center; gap: 10px; }
  #anim-bar input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  #anim-bar .ab-info { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 84px; text-align: center; }
  #anim-bar .ab-desc {
    position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,0.95); border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 6px 12px; font-size: 12px; max-width: 72vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.4);
  }
  #anim-bar .ab-speed { display: flex; gap: 4px; flex: none; }
  #anim-bar .ab-speed button {
    padding: 5px 8px; border-radius: 5px; border: 1px solid var(--panel-border);
    background: #2A2A2A; color: var(--text-dim); cursor: pointer; font-size: 11px;
  }
  #anim-bar .ab-speed button.active { border-color: var(--accent); color: var(--accent); }
  #anim-bar .ab-close { width: 30px; height: 30px; border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 15px; flex: none; }
  #anim-bar .ab-close:hover { color: var(--text); }

  /* 动画当前步节点脉冲 */
  @keyframes animPulse {
    0% { opacity: .9; transform: scale(1); }
    50% { opacity: .3; transform: scale(1.6); }
    100% { opacity: .9; transform: scale(1); }
  }
  .node-g.current .node-glow { animation: animPulse 0.9s ease-in-out infinite; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 60; pointer-events: none; display: none; max-width: 320px;
    background: #262626; border: 1px solid var(--panel-border); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #tooltip .tt-t { font-weight: 600; }
  #tooltip .tt-d { color: var(--text-dim); margin-top: 2px; line-height: 1.5; }

  /* ---------- 右下提示 ---------- */
  #hint {
    position: fixed; right: 12px; bottom: 12px; z-index: 30;
    color: var(--text-dim); font-size: 11px; text-align: right; pointer-events: none;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
</style>
</head>
<body>

<div id="toolbar">
  <div class="logo">Translex <small>全链路依赖图 · L0–L8</small></div>
  <div class="search">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="搜索节点（zlib / qt_pdf / user32 / 服务名…）" spellcheck="false">
  </div>
  <div class="seg" id="seg-color">
    <button data-mode="layer" class="active">按层级</button>
    <button data-mode="owner">按实现主体</button>
  </div>
  <button class="btn" id="btn-reset">↺ 重置视图</button>
  <button class="btn" id="btn-anim" style="color:#6CCB5F;border-color:#6CCB5F55">▶ 依赖动画</button>
  <button class="btn" id="btn-panel">⛭ 图例与过滤</button>
  <div class="stats" id="stats"></div>
</div>

<div id="panel" style="display:none"></div>
<div id="detail"></div>
<svg id="graph"></svg>
<div id="tooltip"></div>
<div id="hint">滚轮缩放 · 空白拖拽平移 · 节点拖拽重排 · 点击节点看详情</div>

<div id="anim-bar">
  <div class="ab-desc" id="ab-desc"></div>
  <button class="ab-btn" id="ab-prev" title="上一步">⏮</button>
  <button class="ab-btn play" id="ab-play" title="播放/暂停">▶</button>
  <button class="ab-btn" id="ab-next" title="下一步">⏭</button>
  <div class="ab-progress">
    <input type="range" id="ab-range" min="0" max="100" value="0">
    <span class="ab-info" id="ab-info">0 / 0</span>
  </div>
  <div class="ab-speed" id="ab-speed">
    <button data-s="0.5">0.5×</button>
    <button data-s="1" class="active">1×</button>
    <button data-s="2">2×</button>
    <button data-s="4">4×</button>
  </div>
  <button class="ab-close" id="ab-close" title="关闭动画">✕</button>
</div>

/* ================= 工具 ================= */
const $ = (id) => document.getElementById(id);
const nodeMap = {};
GRAPH.nodes.forEach(n => nodeMap[n.id] = n);
const layerMeta = {};
GRAPH.layers.forEach(l => layerMeta[l.id] = l);
const ownerMeta = {};
(GRAPH.owners || []).forEach(o => ownerMeta[o.id] = o);

// 当前着色模式：'layer'（按层级）| 'owner'（按实现主体）
let colorMode = 'layer';
function nodeColor(n) {
  if (colorMode === 'owner' && ownerMeta[n.owner]) return ownerMeta[n.owner].color;
  return layerMeta[n.layer].color;
}
function ownerName(id) {
  return ownerMeta[id] ? ownerMeta[id].name : '—';
}

// 邻接表
const adjOut = {}, adjIn = {};
GRAPH.edges.forEach(e => {
  (adjOut[e.source] = adjOut[e.source] || []).push(e);
  (adjIn[e.target] = adjIn[e.target] || []).push(e);
});
const degree = {};
GRAPH.nodes.forEach(n => {
  degree[n.id] = (adjOut[n.id] ? adjOut[n.id].length : 0) + (adjIn[n.id] ? adjIn[n.id].length : 0);
});

const EDGE_STYLE = {
  source:   { color: "#4EC9B0", dash: "5 4",   label: "源码引用 (#include/import)" },
  build:    { color: "#569CD6", dash: "",      label: "编译期链接 (CMake)" },
  runtime:  { color: "#CE9178", dash: "10 5",  label: "运行期加载 (DLL/系统库)" },
  tool:     { color: "#DCDCAA", dash: "3 4",   label: "工具链" },
  test:     { color: "#C586C0", dash: "2 3",   label: "测试关系" },
  package:  { color: "#F48771", dash: "8 3 2 3", label: "打包/部署" },
};

/* ================= 力导向分层布局 ================= */
const W = 1800, H = 1500;
const LAYER_GAP = H / (GRAPH.layers.length + 1);
const byLayer = {};
GRAPH.nodes.forEach(n => { (byLayer[n.layer] = byLayer[n.layer] || []).push(n); });

function initPositions() {
  GRAPH.layers.forEach(l => {
    const list = byLayer[l.id] || [];
    list.forEach((n, i) => {
      n.x = (i + 0.5) * W / Math.max(1, list.length) + (Math.random() - 0.5) * 40;
      n.y = (l.id + 1) * LAYER_GAP + (Math.random() - 0.5) * 30;
      n.vx = 0; n.vy = 0;
    });
  });
}

function runLayout(iters = 380) {
  const ns = GRAPH.nodes;
  for (let iter = 0; iter < iters; iter++) {
    const t = 0.85 * (1 - iter / iters) + 0.15;   // 模拟退火温度
    // 斥力（O(n²)，n≈90 可接受）
    for (let i = 0; i < ns.length; i++) {
      for (let j = i + 1; j < ns.length; j++) {
        const a = ns[i], b = ns[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
        const d = Math.sqrt(d2);
        // 同层强斥（防重叠），跨层弱斥
        const strength = (a.layer === b.layer ? 5200 : 1800) / d2;
        const fx = (dx / d) * strength, fy = (dy / d) * strength;
        a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
      }
    }
    // 边弹簧
    GRAPH.edges.forEach(e => {
      const a = nodeMap[e.source], b = nodeMap[e.target];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = 150 + Math.abs(a.layer - b.layer) * 70;
      const f = 0.028 * (d - rest);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    });
    // 分层弹簧：把节点拉向所属层带。
    // 连接度高的节点（如 translex 有 40+ 条边）被边弹簧合力往下拽，需按 degree 加权补偿。
    ns.forEach(n => {
      const ty = (n.layer + 1) * LAYER_GAP;
      const w = 1 + 0.12 * degree[n.id];
      n.vy += 0.055 * w * (ty - n.y);
      n.vx += 0.004 * (W / 2 - n.x);
    });
    // 积分 + 阻尼
    ns.forEach(n => {
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx * t;
      n.y += n.vy * t;
      n.x = Math.max(60, Math.min(W - 60, n.x));
      n.y = Math.max(60, Math.min(H - 60, n.y));
    });
  }
}

/* ================= SVG 渲染 ================= */
const svg = $("graph");
const NS = "http://www.w3.org/2000/svg";
let root, edgesG, nodesG, bandsG;
let view = { tx: 0, ty: 0, s: 1 };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function nodeRadius(n) {
  return Math.min(17, 5.5 + degree[n.id] * 1.15);
}

function buildScene() {
  svg.innerHTML = "";
  root = el("g", {}, svg);
  bandsG = el("g", { class: "layer-band" }, root);
  edgesG = el("g", {}, root);
  nodesG = el("g", {}, root);

  // 层带背景（按层级着色模式时显示，按主体着色时弱化以免干扰）
  GRAPH.layers.forEach(l => {
    const y = (l.id + 1) * LAYER_GAP;
    const dim = colorMode === 'owner';
    el("rect", { x: 0, y: y - LAYER_GAP / 2 + 26, width: W, height: LAYER_GAP - 52,
                 fill: l.color, opacity: dim ? 0.015 : 0.05 }, bandsG);
    el("line", { x1: 0, y1: y - LAYER_GAP / 2, x2: W, y2: y - LAYER_GAP / 2,
                 stroke: l.color, opacity: dim ? 0.04 : 0.12, "stroke-width": 1 }, bandsG);
    el("text", { x: 16, y: y - LAYER_GAP / 2 + 22, fill: l.color, opacity: dim ? 0.18 : 0.5,
                 "font-size": 12 }, bandsG).textContent = `L${l.id} ${l.name}`;
  });

  // 边
  GRAPH.edges.forEach(e => drawEdge(e, edgesG));
  // 节点
  GRAPH.nodes.forEach(n => drawNode(n, nodesG));
  applyTransform();
}

function drawEdge(e, parent) {
  const a = nodeMap[e.source], b = nodeMap[e.target];
  const st = EDGE_STYLE[e.type] || EDGE_STYLE.build;
  el("line", {
    class: "edge", "data-eid": e.source + "→" + e.target, "data-type": e.type,
    x1: a.x, y1: a.y, x2: b.x, y2: b.y,
    stroke: st.color, "stroke-width": 1.1, opacity: 0.30,
    "stroke-dasharray": st.dash,
  }, parent);
}

function drawNode(n, parent) {
  const g = el("g", { class: "node-g", "data-id": n.id, transform: `translate(${n.x},${n.y})` }, parent);
  const r = nodeRadius(n);
  const color = nodeColor(n);
  el("circle", {
    class: "node-ring", r: r, fill: color,
    stroke: color, "stroke-width": 1.5, opacity: 0.95,
  }, g);
  // 光晕
  el("circle", { class: "node-glow", r: r + 3, fill: "none", stroke: color, opacity: 0.25, "stroke-width": 2 }, g);
  const short = n.label.length > 14 ? n.label.slice(0, 13) + "…" : n.label;
  const txt = el("text", {
    class: "node-label", x: r + 7, y: 4, "text-anchor": "start",
  }, g);
  txt.textContent = short;
  g.dataset.r = r;
  g.dataset.short = short;
}

function applyTransform() {
  root.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.s})`);
}

function refreshEdgePositions() {
  GRAPH.edges.forEach(e => {
    const a = nodeMap[e.source], b = nodeMap[e.target];
    const line = edgesG.querySelector(`[data-eid="${e.source}→${e.target}"]`);
    if (line) { line.setAttribute("x1", a.x); line.setAttribute("y1", a.y); line.setAttribute("x2", b.x); line.setAttribute("y2", b.y); }
  });
}

/* ================= 缩放 / 平移 ================= */
function zoomAt(px, py, factor) {
  const ns = view.s * factor;
  const k = Math.max(0.15, Math.min(3, ns));
  const ratio = k / view.s;
  view.tx = px - (px - view.tx) * ratio;
  view.ty = py - (py - view.ty) * ratio;
  view.s = k;
  applyTransform();
}

svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  zoomAt(ev.clientX - rect.left, ev.clientY - rect.top, ev.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });

let drag = null;
svg.addEventListener("mousedown", (ev) => {
  const target = ev.target.closest(".node-g");
  const rect = svg.getBoundingClientRect();
  const mx = (ev.clientX - rect.left - view.tx) / view.s;
  const my = (ev.clientY - rect.top - view.ty) / view.s;
  if (target) {
    drag = { kind: "node", id: target.dataset.id, x0: ev.clientX, y0: ev.clientY, moved: false, nx: mx, ny: my };
  } else {
    drag = { kind: "pan", x0: ev.clientX, y0: ev.clientY, tx0: view.tx, ty0: view.ty, moved: false };
    svg.classList.add("dragging");
  }
});
window.addEventListener("mousemove", (ev) => {
  if (!drag) return;
  const rect = svg.getBoundingClientRect();
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (drag.kind === "pan") {
    view.tx = drag.tx0 + dx; view.ty = drag.ty0 + dy;
    applyTransform();
  } else if (drag.kind === "node") {
    const n = nodeMap[drag.id];
    n.x = drag.nx + dx / view.s;
    n.y = drag.ny + dy / view.s;
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (g) g.setAttribute("transform", `translate(${n.x},${n.y})`);
    refreshEdgePositions();
  }
});
window.addEventListener("mouseup", (ev) => {
  if (!drag) return;
  const wasDrag = drag.moved;
  if (drag.kind === "node" && !wasDrag) {
    // 视为点击 → 打开详情
    selectNode(drag.id);
  }
  drag = null;
  svg.classList.remove("dragging");
});

/* ================= 点击 / 悬停 ================= */
function selectNode(id) {
  const n = nodeMap[id];
  if (!n) return;
  const color = nodeColor(n);
  const out = (adjOut[id] || []).map(e => e.target);
  const inn = (adjIn[id] || []).map(e => e.source);
  const d = $("detail");
  let html = `<div class="d-title"><span class="badge" style="background:${color}">L${n.layer}</span>${n.label}</div>
              <div class="d-close" onclick="closeDetail()">✕</div>`;
  html += `<div class="d-kv">
             <span class="k">类型</span><span>${n.kind || "—"}</span>
             <span class="k">层</span><span>${layerMeta[n.layer].name}</span>
             <span class="k">主体</span><span>${ownerName(n.owner)}</span>`;
  if (n.version) html += `<span class="k">版本</span><span>${n.version}</span>`;
  if (n.license) html += `<span class="k">许可</span><span>${n.license}</span>`;
  html += `</div>`;
  if (n.desc) html += `<div class="d-desc">${n.desc}</div>`;
  if (n.url) html += `<div class="d-links"><a href="${n.url}" target="_blank" rel="noopener">🔗 主页</a></div>`;
  const chips = [];
  out.forEach(t => chips.push(`<span class="chip" onclick="selectNode('${t}')">→ ${nodeMap[t].label}</span>`));
  inn.forEach(t => chips.push(`<span class="chip" onclick="selectNode('${t}')">← ${nodeMap[t].label}</span>`));
  if (chips.length) html += `<div class="d-deps"><div class="t">依赖 (点击跳转)</div>${chips.join("")}</div>`;
  d.innerHTML = html;
  d.style.display = "block";
}
window.closeDetail = () => { $("detail").style.display = "none"; };
// 暴露给内联 onclick
window.selectNode = selectNode;

// Tooltip（nodesG 事件在 buildScene() 之后绑定，见初始化部分）

function highlightNode(id, on) {
  const set = new Set([id]);
  (adjOut[id] || []).forEach(e => { set.add(e.target); });
  (adjIn[id] || []).forEach(e => { set.add(e.source); });
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (!g) return;
    const active = set.has(n.id);
    g.classList.toggle("dim", !active);
  });
  edgesG.querySelectorAll(".edge").forEach(line => {
    const eid = line.dataset.eid;
    const [s, t] = eid.split("→");
    const active = set.has(s) && set.has(t);
    line.style.opacity = active ? 0.75 : 0.10;
  });
}

/* ================= 过滤 ================= */
const state = { layers: {}, types: {}, owners: {} };
GRAPH.layers.forEach(l => state.layers[l.id] = true);
Object.keys(EDGE_STYLE).forEach(t => state.types[t] = true);
(GRAPH.owners || []).forEach(o => state.owners[o.id] = true);

function nodeVisible(n) {
  return state.layers[n.layer] && state.owners[n.owner !== undefined ? n.owner : 'translex'];
}

function applyFilters() {
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (g) g.style.display = nodeVisible(n) ? "" : "none";
  });
  GRAPH.edges.forEach(e => {
    const line = edgesG.querySelector(`[data-eid="${e.source}→${e.target}"]`);
    if (line) line.style.display = (nodeVisible(nodeMap[e.source]) && nodeVisible(nodeMap[e.target]) && state.types[e.type]) ? "" : "none";
  });
  updateStats();
}

function updateStats() {
  const visNodes = GRAPH.nodes.filter(nodeVisible).length;
  const visEdges = GRAPH.edges.filter(e => nodeVisible(nodeMap[e.source]) && nodeVisible(nodeMap[e.target]) && state.types[e.type]).length;
  $("stats").textContent = `${visNodes} 节点 · ${visEdges} 边`;
}

/* ================= 过滤面板 + 图例 ================= */
function buildPanel() {
  const p = $("panel");
  let html = `<h3>层级过滤</h3>`;
  GRAPH.layers.forEach(l => {
    const cnt = (byLayer[l.id] || []).length;
    html += `<label class="f-item"><input type="checkbox" data-l="${l.id}" checked>
             <span class="dot" style="background:${l.color}"></span>
             <span class="lbl">L${l.id} ${l.name}</span><span class="cnt">${cnt}</span></label>`;
  });
  html += `<h3>实现主体过滤</h3>`;
  (GRAPH.owners || []).forEach(o => {
    const cnt = GRAPH.nodes.filter(n => n.owner === o.id).length;
    html += `<label class="f-item"><input type="checkbox" data-o="${o.id}" checked>
             <span class="dot" style="background:${o.color}"></span>
             <span class="lbl">${o.name}</span><span class="cnt">${cnt}</span></label>`;
  });
  html += `<h3>边类型</h3>`;
  Object.entries(EDGE_STYLE).forEach(([k, st]) => {
    const cnt = GRAPH.edges.filter(e => e.type === k).length;
    html += `<label class="f-item"><input type="checkbox" data-t="${k}" checked>
             <span class="lbl">${st.label}</span><span class="cnt">${cnt}</span></label>`;
  });
  html += `<h3>图例 · 边样式</h3>`;
  Object.entries(EDGE_STYLE).forEach(([k, st]) => {
    html += `<div class="legend-line"><svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="${st.color}" stroke-width="2" stroke-dasharray="${st.dash || "none"}"></line></svg><span>${st.label}</span></div>`;
  });
  p.innerHTML = html;
  p.querySelectorAll("input[data-l]").forEach(cb => {
    cb.addEventListener("change", () => { state.layers[+cb.dataset.l] = cb.checked; applyFilters(); });
  });
  p.querySelectorAll("input[data-o]").forEach(cb => {
    cb.addEventListener("change", () => { state.owners[cb.dataset.o] = cb.checked; applyFilters(); });
  });
  p.querySelectorAll("input[data-t]").forEach(cb => {
    cb.addEventListener("change", () => { state.types[cb.dataset.t] = cb.checked; applyFilters(); });
  });
}

/* ================= 搜索 ================= */
let searchMatches = [];
const searchInput = $("search");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (!g) return;
    const hit = q && (n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q));
    g.style.opacity = hit ? 1 : (q ? 0.18 : 1);
    const ring = g.querySelector(".node-ring");
    ring.setAttribute("r", hit ? nodeRadius(n) + 4 : nodeRadius(n));
    ring.setAttribute("stroke", hit ? "#fff" : nodeColor(n));
  });
});
searchInput.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") {
    const q = searchInput.value.trim().toLowerCase();
    const m = GRAPH.nodes.find(n => n.id.toLowerCase().includes(q) || n.label.toLowerCase().includes(q));
    if (m) {
      selectNode(m.id);
      // 平移到节点
      const rect = svg.getBoundingClientRect();
      view.tx = rect.width / 2 - m.x * view.s;
      view.ty = rect.height / 2 - m.y * view.s;
      applyTransform();
    }
  }
});

/* ================= 顶栏按钮 ================= */
$("btn-reset").addEventListener("click", () => {
  view = { tx: 0, ty: 0, s: 1 };
  applyTransform();
});
$("btn-panel").addEventListener("click", () => {
  const p = $("panel");
  p.style.display = p.style.display === "none" ? "" : "none";
});

// 着色模式切换：按层级 / 按实现主体
function setColorMode(mode) {
  colorMode = mode;
  document.querySelectorAll("#seg-color button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === mode);
  });
  // 重绘节点颜色与层带
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (!g) return;
    const ring = g.querySelector(".node-ring");
    const glow = g.querySelector(".node-glow");
    const c = nodeColor(n);
    if (ring) { ring.setAttribute("fill", c); ring.setAttribute("stroke", c); }
    if (glow) glow.setAttribute("stroke", c);
  });
  // 层带弱化切换（owner 模式下半透明，避免干扰主体色）
  bandsG.setAttribute("opacity", mode === "owner" ? 0.25 : 1);
}
document.querySelectorAll("#seg-color button").forEach(b => {
  b.addEventListener("click", () => setColorMode(b.dataset.mode));
});

/* ================= 依赖扩散动画 =================
 * 从 translex.exe 出发 BFS 扩散，逐节点点亮依赖；不可达节点按层追加保证全覆盖。 */
const anim = {
  steps: [], nodeIdx: {}, edgeIdx: {},
  idx: -1, playing: false, timer: null, speed: 1,
};

function computeAnimSteps() {
  const order = [], visited = new Set(['translex']), queue = ['translex'];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    (adjOut[id] || []).forEach(e => {
      if (!visited.has(e.target)) { visited.add(e.target); queue.push(e.target); }
    });
  }
  // 不可达节点（工具链等）按层追加，保证 178 个节点全部点亮
  GRAPH.nodes.filter(n => !visited.has(n.id))
    .sort((a, b) => a.layer - b.layer)
    .forEach(n => { visited.add(n.id); order.push(n.id); });
  anim.steps = order;
  anim.nodeIdx = {};
  order.forEach((id, i) => anim.nodeIdx[id] = i);
  anim.edgeIdx = {};
  GRAPH.edges.forEach(e => {
    anim.edgeIdx[e.source + '→' + e.target] = Math.max(anim.nodeIdx[e.source], anim.nodeIdx[e.target]);
  });
}

function animRender() {
  const k = anim.idx;
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (!g) return;
    const gi = anim.nodeIdx[n.id];
    const on = gi <= k;
    g.style.opacity = on ? 1 : 0.10;
    g.classList.toggle('current', gi === k);
    const ring = g.querySelector('.node-ring');
    if (ring) ring.setAttribute('stroke', gi === k ? '#fff' : nodeColor(n));
  });
  edgesG.querySelectorAll('.edge').forEach(line => {
    const ei = anim.edgeIdx[line.dataset.eid];
    line.style.opacity = (ei !== undefined && ei <= k) ? 0.35 : 0.05;
  });
  // 进度条 / 步骤说明
  const n = anim.steps.length;
  $('ab-range').value = n ? Math.round(((k + 1) / n) * 100) : 0;
  $('ab-info').textContent = `${Math.min(k + 1, n)} / ${n}`;
  if (k >= 0 && k < n) {
    const node = nodeMap[anim.steps[k]];
    const inEdges = (adjIn[anim.steps[k]] || []).filter(e => anim.nodeIdx[e.source] <= k);
    const parents = inEdges.map(e => nodeMap[e.source].label);
    const et = inEdges[0] ? EDGE_STYLE[inEdges[0].type].label : '';
    let txt = `第 ${k + 1}/${n} 步 · 点亮 ${node.label}（${layerMeta[node.layer].name}）`;
    if (parents.length) txt += ` ｜ ${et}：${parents.slice(0, 3).join('、')}${parents.length > 3 ? ' 等' : ''}`;
    $('ab-desc').textContent = txt;
  }
}

function animResetStyles() {
  GRAPH.nodes.forEach(n => {
    const g = nodesG.querySelector(`[data-id="${n.id}"]`);
    if (!g) return;
    g.style.opacity = '';
    g.classList.remove('current');
    const ring = g.querySelector('.node-ring');
    if (ring) ring.setAttribute('stroke', nodeColor(n));
  });
  edgesG.querySelectorAll('.edge').forEach(line => { line.style.opacity = ''; });
}

function animStep(delta) {
  anim.idx = Math.max(-1, Math.min(anim.steps.length - 1, anim.idx + delta));
  animRender();
  if (anim.idx >= anim.steps.length - 1) animPause(); // 播完暂停，停在末帧
}

function animPlay() {
  if (anim.playing) return;
  if (anim.idx >= anim.steps.length - 1) anim.idx = -1;
  anim.playing = true;
  $('ab-play').textContent = '⏸';
  const tick = () => {
    if (!anim.playing) return;
    animStep(1);
    if (anim.playing) anim.timer = setTimeout(tick, 900 / anim.speed);
  };
  tick();
}

function animPause() {
  anim.playing = false;
  clearTimeout(anim.timer);
  $('ab-play').textContent = '▶';
}

function animStart() {
  computeAnimSteps();
  anim.idx = -1;
  animRender();
  $('anim-bar').classList.add('visible');
  animPlay();
}

function animClose() {
  animPause();
  $('anim-bar').classList.remove('visible');
  animResetStyles();
  applyFilters(); // 恢复过滤状态下的显示
}

$('btn-anim').addEventListener('click', () => {
  if ($('anim-bar').classList.contains('visible')) animClose();
  else animStart();
});
$('ab-play').addEventListener('click', () => { anim.playing ? animPause() : animPlay(); });
$('ab-next').addEventListener('click', () => { animPause(); animStep(1); });
$('ab-prev').addEventListener('click', () => { animPause(); animStep(-1); });
$('ab-close').addEventListener('click', () => animClose());
$('ab-range').addEventListener('input', (ev) => {
  animPause();
  const pct = +ev.target.value;
  anim.idx = anim.steps.length ? Math.round((pct / 100) * (anim.steps.length - 1)) : -1;
  animRender();
});
document.querySelectorAll('#ab-speed button').forEach(b => {
  b.addEventListener('click', () => {
    anim.speed = +b.dataset.s;
    document.querySelectorAll('#ab-speed button').forEach(x => x.classList.toggle('active', x === b));
    if (anim.playing) { animPause(); animPlay(); } // 以新速度重启
  });
});

/* ================= 初始化 ================= */
initPositions();
runLayout();
buildScene();
buildPanel();
applyFilters();

// Tooltip 与节点悬停高亮（nodesG 已由 buildScene() 创建）
const tip = $("tooltip");
nodesG.addEventListener("mouseover", (ev) => {
  const g = ev.target.closest(".node-g");
  if (!g) return;
  const n = nodeMap[g.dataset.id];
  tip.innerHTML = `<div class="tt-t">${n.label}</div><div class="tt-d">${n.desc || ""}</div>`;
  tip.style.display = "block";
  highlightNode(n.id, true);
});
nodesG.addEventListener("mousemove", (ev) => {
  tip.style.left = (ev.clientX + 14) + "px";
  tip.style.top = (ev.clientY + 14) + "px";
});
nodesG.addEventListener("mouseout", (ev) => {
  const g = ev.target.closest(".node-g");
  if (!g) return;
  tip.style.display = "none";
  highlightNode(g.dataset.id, false);
});

// 初始自动缩放适配
function fitView() {
  const rect = svg.getBoundingClientRect();
  const s = Math.min(rect.width / W, rect.height / H) * 0.92;
  view.s = s;
  view.tx = (rect.width - W * s) / 2;
  view.ty = (rect.height - H * s) / 2;
  applyTransform();
}
fitView();
window.addEventListener("resize", fitView);
</script>
